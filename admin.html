<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 - 我的博客</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="centered">
  <header class="site-header">
    <h1><a href="/">我的博客</a></h1>
    <nav>
      <a href="/">首页</a>
      <a href="/archive">归档</a>
      <a href="/about">关于</a>
    </nav>
  </header>

  <main>
    <section id="login-section" hidden>
      <h2>登录</h2>
      <form id="login-form" class="stack">
        <input type="text" name="username" placeholder="用户名" required autocomplete="username">
        <input type="password" name="password" placeholder="密码" required autocomplete="current-password">
        <p class="error"></p>
        <div><button type="submit">登录</button></div>
      </form>
      <p class="muted">还没有账号？<a href="/register">去注册</a></p>
    </section>

    <section id="admin-section" hidden>
      <div class="admin-head">
        <h2>文章管理 <span id="whoami" class="muted"></span></h2>
        <div class="row-actions">
          <button id="new-post-btn">新建文章</button>
          <button id="logout-btn">退出登录</button>
        </div>
      </div>

      <ul id="manage-list" class="manage-list"></ul>

      <section id="visits-section" hidden>
        <h2>访问记录</h2>
        <div id="visit-stats" class="visit-stats"></div>
        <table class="visits-table">
          <thead>
            <tr><th>时间</th><th>用户</th><th>页面</th></tr>
          </thead>
          <tbody id="visit-rows"></tbody>
        </table>
      </section>

      <section id="editor-section" hidden>
        <h3 id="editor-title">新建文章</h3>
        <form id="editor-form" class="stack">
          <input type="text" name="title" placeholder="标题" required>
          <input type="text" name="slug" placeholder="slug，留空自动生成（如 my-first-post）">
          <label class="check">
            <input type="checkbox" name="published"> 发布（不勾选保存为草稿）
          </label>
          <textarea name="content" rows="16" placeholder="正文，支持 Markdown" required></textarea>
          <p class="error"></p>
          <div class="row-actions">
            <button type="submit">保存</button>
            <button type="button" id="editor-cancel">取消</button>
          </div>
        </form>
      </section>
    </section>
  </main>
  <script src="/js/admin.js" defer></script>
</body>
</html>
