name: keep-warm

on:
  schedule:
    # 每 10 分钟访问一次主页面，防止 Vercel 函数休眠（cron 使用 UTC 时间）
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping blog routes
        run: |
          curl -s -o /dev/null --max-time 30 "https://blog-lyart-eta.vercel.app/" || true
          curl -s -o /dev/null --max-time 30 "https://blog-lyart-eta.vercel.app/archive" || true
          curl -s -o /dev/null --max-time 30 "https://blog-lyart-eta.vercel.app/about" || true
