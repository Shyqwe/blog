<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 我的博客</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">我的博客</a></h1>
    <nav>
      <a href="/login">登录</a>
      <a href="/register">注册</a>
    </nav>
  </header>

  <main>
    <section class="auth-box">
      <h2>注册</h2>
      <form id="register-form" class="stack">
        <input type="text" name="account" placeholder="账号（3-30 位字母、数字、_ 或 -）" required autocomplete="username">
        <input type="text" name="username" placeholder="用户名（发表文章时展示，最多 20 字）" required maxlength="20">
        <input type="password" name="password" placeholder="密码（至少 6 位）" required minlength="6" autocomplete="new-password">
        <input type="password" name="password2" placeholder="确认密码" required autocomplete="new-password">
        <p class="error"></p>
        <div><button type="submit">注册并登录</button></div>
      </form>
      <p class="muted">已有账号？<a href="/login">去登录</a></p>
      <p class="muted">第一位注册的用户将成为本站管理员。</p>
    </section>
  </main>
  <script src="/js/register.js" defer></script>
</body>
</html>
